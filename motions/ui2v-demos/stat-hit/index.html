<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Stat Hit</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500&display=swap");
      body {
        margin: 0;
        background: #0a0c10;
        color: #f7f4ee;
        font-family: "Bricolage Grotesque", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: linear-gradient(145deg, #0a0c10 0%, #121826 45%, #1a120c 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .ring {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 0 1px rgba(61, 139, 255, 0.15);
      }
      .ring-progress {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: conic-gradient(#3d8bff var(--p, 0%), transparent 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
        opacity: 0;
      }
      .center {
        position: relative;
        z-index: 1;
        text-align: center;
      }
      .label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 24px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(247, 244, 238, 0.55);
        opacity: 0;
      }
      .value {
        margin: 12px 0 0;
        font-size: 220px;
        line-height: 0.9;
        letter-spacing: -0.06em;
        opacity: 0;
      }
      .unit {
        font-size: 42px;
        color: #ff7a2f;
        margin-left: 8px;
      }
      .caption {
        margin-top: 18px;
        font-size: 34px;
        color: rgba(247, 244, 238, 0.7);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="stat-hit"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
    >
      <section class="clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="ring" id="st-ring"></div>
        <div class="ring-progress" id="st-progress"></div>
        <div class="center">
          <div class="label" id="st-label">Install velocity</div>
          <h1 class="value" id="st-value">0<span class="unit">×</span></h1>
          <p class="caption" id="st-caption">faster motion loops on UI2V</p>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const state = { n: 0, p: 0 };
      const valueEl = document.getElementById("st-value");
      const progressEl = document.getElementById("st-progress");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#st-label", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0)
        .fromTo("#st-value", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.1)
        .fromTo("#st-progress", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.15)
        .to(
          state,
          {
            n: 12,
            p: 100,
            duration: 1.6,
            ease: "power2.out",
            onUpdate() {
              valueEl.innerHTML = `${Math.round(state.n)}<span class="unit">×</span>`;
              progressEl.style.setProperty("--p", `${state.p}%`);
            },
          },
          0.25,
        )
        .fromTo("#st-caption", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 1.5)
        .to("#st-ring", { scale: 1.04, duration: 0.35, yoyo: true, repeat: 1, ease: "power1.inOut" }, 1.9);
      window.__timelines["stat-hit"] = tl;
    </script>
  </body>
</html>
