<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>UI2V Kinetic Title</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500&display=swap");
      body {
        margin: 0;
        background: #07090d;
        color: #f4f1ea;
        font-family: "Bricolage Grotesque", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 80% 60% at 20% 30%, rgba(61, 139, 255, 0.22), transparent 55%),
          radial-gradient(ellipse 70% 50% at 80% 70%, rgba(255, 122, 47, 0.18), transparent 50%),
          #07090d;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: 0.5;
      }
      .stack {
        position: absolute;
        left: 160px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        gap: 28px;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 28px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7eb6ff;
        opacity: 0;
      }
      .title {
        margin: 0;
        font-size: 168px;
        line-height: 0.92;
        letter-spacing: -0.04em;
        opacity: 0;
      }
      .title span {
        display: inline-block;
      }
      .rule {
        width: 0;
        height: 4px;
        background: linear-gradient(90deg, #ff7a2f, #3d8bff);
        border-radius: 999px;
      }
      .sub {
        margin: 0;
        max-width: 920px;
        font-size: 36px;
        font-weight: 500;
        color: rgba(244, 241, 234, 0.72);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="kinetic-title"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
    >
      <section class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="grid" id="kt-grid"></div>
        <div class="stack">
          <div class="eyebrow" id="kt-eye">HyperFrames × UI2V</div>
          <h1 class="title" id="kt-title"><span>Motion</span> <span>that</span> <span>ships.</span></h1>
          <div class="rule" id="kt-rule"></div>
          <p class="sub" id="kt-sub">Publish HTML compositions. Preview with a real player.</p>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kt-grid", { opacity: 0 }, { opacity: 0.5, duration: 0.6, ease: "power2.out" }, 0)
        .fromTo("#kt-eye", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.15)
        .fromTo(
          "#kt-title span",
          { y: 80, opacity: 0, rotateX: -40 },
          { y: 0, opacity: 1, rotateX: 0, duration: 0.7, stagger: 0.08, ease: "power4.out" },
          0.25,
        )
        .to("#kt-rule", { width: 420, duration: 0.55, ease: "power3.out" }, 0.85)
        .fromTo("#kt-sub", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, 1.0);
      window.__timelines["kinetic-title"] = tl;
    </script>
  </body>
</html>
