<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mini Map</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500&display=swap");
      body { margin: 0; background: #071018; color: #eaf2ff; font-family: "Bricolage Grotesque", sans-serif; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background:
          radial-gradient(ellipse 70% 55% at 50% 45%, rgba(61,139,255,0.16), transparent 65%),
          #071018;
      }
      .clip { position: absolute; inset: 0; display: grid; place-items: center; }
      .panel {
        width: 1400px; height: 820px; border-radius: 36px; position: relative;
        background: linear-gradient(160deg, #0d1824, #101c2a 50%, #0b1520);
        border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
      }
      .title {
        position: absolute; left: 56px; top: 48px; z-index: 2;
        font-size: 42px; letter-spacing: -0.03em; opacity: 0;
      }
      .sub {
        position: absolute; left: 56px; top: 104px; z-index: 2;
        font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: 0.16em;
        text-transform: uppercase; color: rgba(234,242,255,0.5); opacity: 0;
      }
      svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .land { fill: rgba(120,160,210,0.12); stroke: rgba(180,210,255,0.18); stroke-width: 2; }
      .route {
        fill: none; stroke: #3d8bff; stroke-width: 6; stroke-linecap: round;
        stroke-dasharray: 1200; stroke-dashoffset: 1200; filter: drop-shadow(0 0 12px rgba(61,139,255,0.55));
      }
      .city { opacity: 0; }
      .pin { fill: #ff7a2f; }
      .label { fill: #eaf2ff; font-family: "IBM Plex Mono", monospace; font-size: 22px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="mini-map" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <section class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="panel">
          <h1 class="title" id="mm-title">SF → NYC corridor</h1>
          <p class="sub" id="mm-sub">Shipping latency · live demo</p>
          <svg viewBox="0 0 1400 820" aria-hidden="true">
            <path class="land" d="M120 520 C220 360 360 300 520 340 C680 380 760 300 900 280 C1040 260 1180 320 1280 420 L1280 700 L120 700 Z" />
            <path id="mm-route" class="route" d="M280 470 C480 420 720 360 980 390 C1080 405 1160 430 1220 470" />
            <g class="city" id="mm-sf">
              <circle class="pin" cx="280" cy="470" r="12" />
              <text class="label" x="300" y="456">San Francisco</text>
            </g>
            <g class="city" id="mm-nyc">
              <circle class="pin" cx="1220" cy="470" r="12" />
              <text class="label" x="980" y="456">New York</text>
            </g>
          </svg>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mm-title", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.1)
        .fromTo("#mm-sub", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.25)
        .fromTo("#mm-sf", { scale: 0.4, opacity: 0, transformOrigin: "280px 470px" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, 0.45)
        .to("#mm-route", { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, 0.7)
        .fromTo("#mm-nyc", { scale: 0.4, opacity: 0, transformOrigin: "1220px 470px" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, 2.2)
        .to("#mm-route", { strokeWidth: 8, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.8);
      window.__timelines["mini-map"] = tl;
    </script>
  </body>
</html>
