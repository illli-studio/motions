<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tweet Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@500&display=swap");
      body { margin: 0; background: #05070b; color: #e8eef8; font-family: "Bricolage Grotesque", sans-serif; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 40%, rgba(61,139,255,0.2), transparent 60%),
          #05070b;
      }
      .clip { position: absolute; inset: 0; display: grid; place-items: center; }
      .card {
        width: 820px; padding: 42px 46px; border-radius: 32px;
        background: rgba(16,20,28,0.94); border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 40px 120px rgba(0,0,0,0.45); opacity: 0; transform: translateY(36px) scale(0.96);
      }
      .row { display: flex; gap: 16px; align-items: center; }
      .avatar {
        width: 64px; height: 64px; border-radius: 50%;
        background: linear-gradient(145deg, #3d8bff, #ff7a2f); display: grid; place-items: center;
        font-weight: 700; font-size: 28px;
      }
      .handle { margin: 0; font-size: 28px; }
      .at { margin: 4px 0 0; font-family: "IBM Plex Mono", monospace; font-size: 18px; color: rgba(232,238,248,0.5); }
      .body { margin: 28px 0 0; font-size: 36px; line-height: 1.35; letter-spacing: -0.02em; }
      .stats {
        margin: 32px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        font-family: "IBM Plex Mono", monospace; font-size: 18px; color: rgba(232,238,248,0.6);
      }
      .stat strong { display: block; color: #fff; font-size: 28px; margin-bottom: 4px; font-family: "Bricolage Grotesque", sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="tweet-card" data-start="0" data-width="1920" data-height="1080" data-duration="4">
      <section class="clip" data-start="0" data-duration="4" data-track-index="0">
        <article class="card" id="tw-card">
          <div class="row">
            <div class="avatar">U</div>
            <div>
              <p class="handle">UI2V</p>
              <p class="at">@ui2v · just now</p>
            </div>
          </div>
          <p class="body" id="tw-body">Ship a HyperFrames block once. Preview it everywhere. Install it with one command.</p>
          <div class="stats" id="tw-stats">
            <div class="stat"><strong id="tw-replies">0</strong>Replies</div>
            <div class="stat"><strong id="tw-reposts">0</strong>Reposts</div>
            <div class="stat"><strong id="tw-likes">0</strong>Likes</div>
          </div>
        </article>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const counts = { replies: 0, reposts: 0, likes: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tw-card", { y: 36, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.65, ease: "power3.out" }, 0.15)
        .fromTo("#tw-body", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.45)
        .fromTo("#tw-stats", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.75)
        .to(counts, {
          replies: 42, reposts: 318, likes: 2400, duration: 1.4, ease: "power2.out",
          onUpdate() {
            document.getElementById("tw-replies").textContent = Math.round(counts.replies);
            document.getElementById("tw-reposts").textContent = Math.round(counts.reposts);
            document.getElementById("tw-likes").textContent = Math.round(counts.likes).toLocaleString("en-US");
          },
        }, 0.9)
        .to("#tw-card", { y: -6, duration: 0.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.4);
      window.__timelines["tweet-card"] = tl;
    </script>
  </body>
</html>
