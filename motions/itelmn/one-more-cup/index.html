<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>One More Cup</title><style>@font-face{font-family:CupSerif;src:url('assets/serif.ttf')}@font-face{font-family:CupMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#f4eddf;width:100%;height:100%;overflow:hidden}#one-more-cup{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="one-more-cup" data-composition-id="one-more-cup" data-start="0" data-duration="24" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="Two hollow ceramic cups receive tea beside a rainy window. Self-moving props tell a small story of shared warmth."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
const context=document.getElementById('scene').getContext('2d');
const tl=gsap.timeline({paused:true});
tl.to('#scene',{opacity:1,duration:24,ease:'none',onUpdate:()=>OneMoreCup.render(context,tl.time())});
window.__timelines={'one-more-cup':tl};
OneMoreCup.render(context,0);
document.fonts.ready.then(()=>OneMoreCup.render(context,tl.time()));
</script></body></html>
