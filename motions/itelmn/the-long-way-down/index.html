<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Long Way Down — Gravity Studies</title><style>@font-face{font-family:RunSerif;src:url('assets/serif.ttf')}@font-face{font-family:RunMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#251b2b;width:100%;height:100%;overflow:hidden}#marble-run{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="marble-run" data-composition-id="marble-run" data-start="0" data-duration="24" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="A mint marble rolls over a porcelain crest, descends a banked S track, and rings a brass bell."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
