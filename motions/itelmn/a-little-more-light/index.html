<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>A Little More Light</title><style>@font-face{font-family:LanternSerif;src:url('assets/serif.ttf')}@font-face{font-family:LanternMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#201e32;width:100%;height:100%;overflow:hidden}#lantern{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="lantern" data-composition-id="lantern" data-start="0" data-duration="24" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="An articulated ceramic desk lamp unfolds and reveals two miniature botanical islands with a warm cone of light."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
const context=document.getElementById('scene').getContext('2d');
const tl=gsap.timeline({paused:true});
tl.to('#scene',{opacity:1,duration:24,ease:'none',onUpdate:()=>Lantern.render(context,tl.time())});
window.__timelines={'lantern':tl};
Lantern.render(context,0);
document.fonts.ready.then(()=>Lantern.render(context,tl.time()));
</script></body></html>
