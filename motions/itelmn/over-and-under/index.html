<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Over and Under</title><style>@font-face{font-family:WeaveSerif;src:url('assets/serif.ttf')}@font-face{font-family:WeaveMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#f2ebdf;width:100%;height:100%;overflow:hidden}#weave{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="weave" data-composition-id="weave" data-start="0" data-duration="24" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="Rigid coral rails and teal crossbars assemble into a three-dimensional interleaved diamond lattice."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
const context=document.getElementById('scene').getContext('2d');
const tl=gsap.timeline({paused:true});
tl.to('#scene',{opacity:1,duration:24,ease:'none',onUpdate:()=>Weave.render(context,tl.time())});
window.__timelines={'weave':tl};
Weave.render(context,0);
document.fonts.ready.then(()=>Weave.render(context,tl.time()));
</script></body></html>
