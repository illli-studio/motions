<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Between the Pages</title><style>@font-face{font-family:BookmarkSerif;src:url('assets/serif.ttf')}@font-face{font-family:BookmarkMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#eee7d9;width:100%;height:100%;overflow:hidden}#bookmark{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="bookmark" data-composition-id="bookmark" data-start="0" data-duration="24" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="A hardcover book opens into illustrated landscapes and a saffron ribbon bookmark finds its resting place."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
const context=document.getElementById('scene').getContext('2d');
const tl=gsap.timeline({paused:true});
tl.to('#scene',{opacity:1,duration:24,ease:'none',onUpdate:()=>Bookmark.render(context,tl.time())});
window.__timelines={'bookmark':tl};
Bookmark.render(context,0);
document.fonts.ready.then(()=>Bookmark.render(context,tl.time()));
</script></body></html>
