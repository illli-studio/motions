<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>降噪，不等于静音</title><style>@font-face{font-family:Teach;src:url('assets/teach.otf?v=2')}@font-face{font-family:DataMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#101C32;overflow:hidden}#anc{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="anc" data-composition-id="anc" data-start="0" data-duration="30" data-width="1920" data-height="1080"><canvas class="clip" data-start="0" data-duration="30" id="scene" width="1920" height="1080" aria-label="主动降噪原理：检测、反相叠加、时间误差与被动隔音"></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="30" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js?v=4"></script><script>const context=document.getElementById('scene').getContext('2d');const tl=gsap.timeline({paused:true});tl.from('#scene',{opacity:0,duration:.2},0);tl.to({time:0},{time:30,duration:30,ease:'none',onUpdate:()=>ANC.render(context,tl.time())},0);window.__timelines={anc:tl};ANC.render(context,0);document.fonts.load('40px Teach').then(()=>ANC.render(context,tl.time()));</script></body></html>
