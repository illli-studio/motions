<!doctype html><html lang="en"><head><meta charset="utf-8"><title>UI2V Layered ceramic frames</title><style>html,body{margin:0;width:1920px;height:480px;overflow:hidden;background:#fafaff}main{position:relative;width:1920px;height:480px}canvas{display:block;position:absolute;top:25px;left:0;width:1920px;height:430px}</style><script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script><script src="./assets/gsap.min.js"></script><script src="./assets/font.js"></script></head><body data-study="motion-atlas"><main id="motion-atlas" data-composition-id="motion-atlas" data-start="0" data-duration="12" data-width="1920" data-height="480"><div id="ambient-clip" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0" aria-label="Ambient homepage background, central area kept clear"></div></main><script type="module">import * as THREE from 'three';
import { RoomEnvironment } from './assets/RoomEnvironment.js';
import { FontLoader } from './assets/FontLoader.js';
import { TextGeometry } from './assets/TextGeometry.js';

const kind = document.body.dataset.study;
const dark = false;
const stage = document.querySelector('[data-composition-id]');
const scene = new THREE.Scene();
scene.background = new THREE.Color(dark ? '#18191c' : '#fafaff');
scene.fog = new THREE.Fog(dark ? '#18191c' : '#fafaff', 25, 55);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(1920, 430);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = dark ? 1.25 : .94;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.setAttribute('aria-label', kind === 'motion-atlas' ? 'UI2V ceramic lettering and animated composition frames' : kind === 'frame-orchestra' ? 'A physical film timeline folds into a sequenced motion gallery' : 'A polished metal playback aperture opening around a UI2V play mark');
renderer.domElement.setAttribute('role', 'img');
stage.appendChild(renderer.domElement);
const camera = new THREE.OrthographicCamera(-14,14,3.1354,-3.1354,.1,100);
camera.position.set(0,3.2,18); camera.lookAt(0,0,0);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .75;
const ambient = new THREE.HemisphereLight('#ffffff', dark ? '#23232b' : '#a8a9b3', .7);
scene.add(ambient);
const key = new THREE.DirectionalLight('#ffffff', 3);
key.position.set(-5, 10, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -16; key.shadow.camera.right = 16;
key.shadow.camera.top = 12; key.shadow.camera.bottom = -12; key.shadow.normalBias = .035;
key.shadow.bias = -.0001; key.shadow.radius = 4; scene.add(key);
const fill = new THREE.DirectionalLight('#b9b4ff', dark ? 3 : .7);
fill.position.set(8, 4, -3); scene.add(fill);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: dark ? '#09090c' : '#fafaff', roughness: dark ? .7 : .58, metalness: .05, envMapIntensity: dark ? .12 : 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.5; floor.receiveShadow = true; scene.add(floor);
const matte = new THREE.MeshStandardMaterial({ color: '#d1d2d8', roughness: .27, metalness: .08 });
const graphite = new THREE.MeshStandardMaterial({ color: '#24252a', roughness: .32, metalness: .35 });
const lilac = new THREE.MeshStandardMaterial({ color: '#b9b4ff', roughness: .25, metalness: .16 });
const silver = new THREE.MeshStandardMaterial({ color: '#cfd2da', metalness: 1, roughness: .17 });
const font = new FontLoader().parse(window.UI2VTypeface);
const root = new THREE.Group(); scene.add(root);
const tl = gsap.timeline({ paused: true });
window.__timelines = window.__timelines || {};
window.__timelines[kind] = tl;

function roundedShape(w, h, r) {
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y); shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r); shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h); shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r); shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y); return shape;
}
function slab(w, h, depth, material, radius = .08) {
  const geo = new THREE.ExtrudeGeometry(roundedShape(w, h, radius), { depth, bevelEnabled: true, bevelSize: .035, bevelThickness: .035, bevelSegments: 3, steps: 1, curveSegments: 16 });
  geo.translate(0, 0, -depth / 2);
  const mesh = new THREE.Mesh(geo, material); mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
}
function lettering(text, size, depth, material) {
  const geo = new TextGeometry(text, { font, size, depth, curveSegments: 16, bevelEnabled: true, bevelThickness: .035, bevelSize: .025, bevelSegments: 4 });
  geo.computeBoundingBox(); const box = geo.boundingBox;
  geo.translate(-(box.max.x + box.min.x) / 2, -(box.max.y + box.min.y) / 2, -depth / 2);
  const mesh = new THREE.Mesh(geo, material); mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
}
function panelTexture(index) {
  const canvas = document.createElement('canvas'); canvas.width = 960; canvas.height = kind === 'frame-orchestra' ? 1184 : 640;
  const ctx = canvas.getContext('2d');
  const palettes = [['#24252a','#fafaff'], ['#b9b4ff','#24252a'], ['#e7e7e3','#24252a']];
  const [bg, fg] = palettes[index % 3]; ctx.fillStyle = bg; ctx.fillRect(0,0,960,canvas.height);
  ctx.translate(0,(canvas.height-640)/2);
  ctx.fillStyle = fg; ctx.font = 'bold 106px Arial';
  if (index % 3 === 0) {
    ctx.fillText('Make it', 64, 133); ctx.fillText('move.', 64, 243);
    for (let i=0;i<4;i++) { ctx.save(); ctx.translate(655,420); ctx.rotate(i * Math.PI / 4); ctx.fillRect(-174,-23,348,46); ctx.restore(); }
  } else if (index % 3 === 1) {
    ctx.fillText('Beyond',64,530); ctx.fillText('the frame.',64,625);
    for(let i=0;i<6;i++) { ctx.beginPath(); ctx.arc(480,220,38+i*28,0,Math.PI*2); ctx.lineWidth=10; ctx.strokeStyle=fg; ctx.stroke(); }
  } else {
    ctx.font='bold 220px Arial'; ctx.fillText('ui2v',64,258);
    for(let i=0;i<9;i++) ctx.fillRect(75+i*96,370+(i%3)*25,55,180-(i%3)*25);
  }
  const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy(); return texture;
}
function frame(index, w=3.4, h=2.25) {
  const group = new THREE.Group();
  group.add(slab(w+.12,h+.12,.12,dark?silver:graphite,.1));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({ map: panelTexture(index), roughness:.42, metalness:.03 }));
  face.position.z = .13; group.add(face); return group;
}
function playMark(material, scale=1) {
  const shape = new THREE.Shape(); shape.moveTo(-.65,-.95); shape.lineTo(1,.0); shape.lineTo(-.65,.95); shape.closePath();
  const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:.3,bevelEnabled:true,bevelSegments:6,bevelSize:.1,bevelThickness:.1}),material);
  mesh.scale.setScalar(scale); mesh.castShadow=true; return mesh;
}

// Keep the actual sculptures from the approved video, but stage them entirely
// outside the homepage's central reading area. Every ambient move closes at 12s.
function breathe(object, property, next, start, duration=6) {
  const initial={};for(const key of Object.keys(next)) initial[key]=object[property][key];
  tl.to(object[property],{...next,duration,ease:'sine.inOut'},start);
  tl.to(object[property],{...initial,duration:12-start-duration,ease:'sine.inOut'},start+duration);
}
if(kind==='motion-atlas') {
  const word=lettering('ui2v',1.7,.42,matte);word.position.set(-10.6,-.95,.8);word.rotation.set(-.02,.16,-.025);root.add(word);
  const left=frame(0,3.4,2.27);left.position.set(-11.2,.55,-1);left.rotation.set(.08,.36,-.12);root.add(left);
  const right=frame(1,3.3,2.2);right.position.set(10.5,.2,.05);right.rotation.set(.07,-.3,.1);root.add(right);
  const behind=frame(2,2.8,1.87);behind.position.set(12.3,.95,-1.2);behind.rotation.set(.06,-.1,-.12);root.add(behind);
  const token=playMark(lilac,.38);token.position.set(-8.65,1.1,.3);token.rotation.y=.2;root.add(token);
  breathe(word,'rotation',{y:-.1},0);breathe(left,'rotation',{y:.1,z:-.02},0);
  breathe(right,'rotation',{y:-.08,z:-.035},0);breathe(behind,'position',{y:1.15},0);
  breathe(token,'rotation',{y:.75,z:.1},0);breathe(word,'position',{y:-.8},0);
}else if(kind==='frame-orchestra'){
  for(const sign of [-1,1]){
    const group=new THREE.Group();group.position.set(sign*11.1,-.15,-.15);group.rotation.y=sign*-.14;root.add(group);
    for(let i=0;i<5;i++){
      const panel=frame(i,1.45,2.3);panel.position.set(sign*(i-2)*.43,.13*Math.sin(i),-Math.abs(i-2)*.25);panel.rotation.y=sign*(.3+i*.12);group.add(panel);
      breathe(panel,'rotation',{y:sign*(.75+i*.09)},0);
      breathe(panel,'position',{x:sign*(i-2)*.57,y:.13*Math.sin(i)+.1},0);
    }
    const word=lettering('ui2v',1.05,.2,silver);word.position.set(0,-1.35,1.5);group.add(word);
    breathe(group,'rotation',{y:sign*.1},0);
  }
}else{
  const sculpture=new THREE.Group();sculpture.position.set(10.65,.3,-.15);sculpture.scale.setScalar(.76);sculpture.rotation.set(.13,-.28,-.2);root.add(sculpture);
  for(let i=0;i<5;i++){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35+i*.33,.12+(i===4?.04:0),24,160),i===2?lilac:silver);ring.castShadow=true;ring.rotation.set(i*.17,i*.12,0);sculpture.add(ring);
    breathe(ring,'rotation',{x:i*.17+.45,y:i*.12+.6},0);
  }
  const mark=playMark(graphite,.85);mark.position.set(-.12,0,.3);sculpture.add(mark);
  const word=lettering('ui2v',1.7,.3,graphite);word.position.set(-10.7,-.75,.6);word.rotation.y=.18;root.add(word);
  const back=frame(1,3.2,2.14);back.position.set(-11.6,.7,-1.2);back.rotation.set(.05,.23,-.15);root.add(back);
  const bottom=slab(5.8,2.5,.12,matte,.05);bottom.position.set(10.65,-2.3,0);bottom.rotation.x=-Math.PI/2;root.add(bottom);
  breathe(sculpture,'rotation',{y:.15,z:.05},0);breathe(mark,'rotation',{y:.65},0);breathe(word,'rotation',{y:-.07},0);breathe(back,'rotation',{y:.05,z:-.02},0);
}
const render=()=>renderer.render(scene,camera);tl.eventCallback('onUpdate',render);tl.eventCallback('onComplete',()=>window.parent.postMessage({type:'ui2v-study-complete'},location.origin));render();
window.__ui2vStudy={play(){tl.time()>=11.99?tl.restart():tl.play()},pause(){tl.pause()},seek(time){tl.pause().seek(time);render()},restart(){tl.restart()}};
window.parent.postMessage({type:'ui2v-study-ready',study:kind},location.origin);
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent)return;const api=window.__ui2vStudy;switch(event.data?.type){case 'study-play':api.play();break;case 'study-pause':api.pause();break;case 'study-seek':api.seek(Math.max(0,Math.min(12,Number(event.data.time)||0)));break;case 'study-loop':case 'study-restart':api.restart();break}});

</script></body></html>
