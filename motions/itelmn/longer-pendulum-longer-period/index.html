<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>长摆，为什么摆得慢？</title><style>@font-face{font-family:PendulumSans;src:url('assets/pendulum.ttf')}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#F4F7F8}#pendulum-science{position:relative;width:1920px;height:1080px}canvas{position:absolute;inset:0;width:1920px;height:1080px}</style></head><body><div id="pendulum-science" data-composition-id="pendulum-science" data-start="0" data-duration="28" data-width="1920" data-height="1080"><canvas id="scene" class="clip" data-start="0" data-duration="28" data-track-index="0" width="1920" height="1080" aria-label="同小摆角短摆与四倍长摆的完整周期比较"></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="28" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>gsap.ticker.lagSmoothing(0);const context=document.getElementById('scene').getContext('2d');const clock={time:0};const tl=gsap.timeline({paused:true});tl.to(clock,{time:28,duration:28,ease:'none',onUpdate:()=>PendulumScience.render(context,tl.time())},0);window.__timelines={'pendulum-science':tl};PendulumScience.render(context,0);document.fonts.load('40px PendulumSans').then(()=>PendulumScience.render(context,tl.time()));</script></body></html>
