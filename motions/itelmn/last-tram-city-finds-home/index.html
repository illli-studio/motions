<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Last Tram — A City Finds Its Way Home</title><style>@font-face{font-family:TramSerif;src:url('assets/serif.ttf')}@font-face{font-family:TramMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#101d26;width:100%;height:100%;overflow:hidden}#last-tram{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="last-tram" data-composition-id="last-tram" data-start="0" data-duration="24" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="A transit map becomes a geometric midnight city, and an amber tram crosses the river to a warmly lit station."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
const context=document.getElementById('scene').getContext('2d');
const tl=gsap.timeline({paused:true});
tl.to('#scene',{opacity:1,duration:24,ease:'none',onUpdate:()=>LastTram.render(context,tl.time())});

document.fonts.ready.then(()=>LastTram.render(context,tl.time()));
</script></body></html>
