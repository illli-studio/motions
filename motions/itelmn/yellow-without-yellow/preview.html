<!DOCTYPE html><html><head><meta charset="utf-8"><title>Yellow — Native playback QA</title><style>body{margin:0;background:#f4f0e5;color:#263f42;font:16px sans-serif}main{width:min(96vw,1280px);margin:12px auto}iframe{border:0;width:100%;aspect-ratio:16/9}button{padding:12px;margin:6px;background:#e3b775;color:#101d26;border:0;border-radius:4px}input{width:45%}</style></head><body><main><iframe id="film" src="index.html"></iframe><div><button id="play">Play / Pause</button><button id="restart">Restart</button><button data-time="0">0 s</button><button data-time="5">5 s</button><button data-time="10">10 s</button><button data-time="15">15 s</button><button data-time="18">18 s</button><button data-time="27">27 s</button><input id="time" type="range" min="0" max="28" step="0.033333" value="0"><output id="stamp">0.00 s</output></div><p>Native procedural geometry • 1920 × 1080 • 28 seconds • original score • no video plate</p></main><script>const iframe=document.getElementById('film');let tl,audio;iframe.onload=()=>{const w=iframe.contentWindow;tl=w.__timelines['pixel-science'];audio=w.document.getElementById('score');const box=iframe.getBoundingClientRect();w.document.getElementById('pixel-science').style.transform='scale('+box.width/1920+')';w.document.getElementById('pixel-science').style.transformOrigin='0 0';tl.eventCallback('onUpdate',()=>{document.getElementById('time').value=tl.time();document.getElementById('stamp').value=tl.time().toFixed(2)+' s'});};function seek(t){tl.pause(t);iframe.contentWindow.PixelScience.render(iframe.contentWindow.document.getElementById('scene').getContext('2d'),t);audio.pause();audio.currentTime=t;document.getElementById('stamp').value=t.toFixed(2)+' s';document.getElementById('time').value=t}document.getElementById('play').onclick=()=>{if(tl.paused()){tl.play();audio.currentTime=tl.time();audio.play()}else{tl.pause();audio.pause()}};document.getElementById('restart').onclick=()=>seek(0);document.getElementById('time').oninput=e=>seek(+e.target.value);document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>seek(+b.dataset.time));</script></body></html>
