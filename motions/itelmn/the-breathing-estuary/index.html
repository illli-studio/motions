<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Breathing Estuary</title><style>@font-face{font-family:EstuarySerif;src:url('assets/serif.ttf')}@font-face{font-family:EstuaryMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#f4eddf;width:100%;height:100%;overflow:hidden}#breathing-estuary{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="breathing-estuary" data-composition-id="breathing-estuary" data-start="0" data-duration="24" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="A stylized tide rises through connected channels in a sculpted estuary and recedes to reveal sandbanks."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
const context=document.getElementById('scene').getContext('2d');
const tl=gsap.timeline({paused:true});
tl.to('#scene',{opacity:1,duration:24,ease:'none',onUpdate:()=>BreathingEstuary.render(context,tl.time())});
window.__timelines={'breathing-estuary':tl};
BreathingEstuary.render(context,0);
document.fonts.ready.then(()=>BreathingEstuary.render(context,tl.time()));
</script></body></html>
