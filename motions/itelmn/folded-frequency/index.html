<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Folded Frequency</title><style>@font-face{font-family:FoldSerif;src:url('assets/serif.ttf')}@font-face{font-family:FoldMono;src:url('assets/mono.ttf')}html,body{margin:0;background:#101621;width:100%;height:100%;overflow:hidden}#folded-frequency{position:relative;width:1920px;height:1080px}canvas{display:block;width:1920px;height:1080px}</style></head><body><div id="folded-frequency" data-composition-id="folded-frequency" data-start="0" data-duration="22" data-width="1920" data-height="1080"><canvas id="scene" width="1920" height="1080" aria-label="A waveform folds into a three-dimensional ribbon carrying pulses of sound."></canvas><audio id="score" src="assets/score.mp3" data-start="0" data-duration="22" data-track-index="1" data-volume="1"></audio></div><script src="assets/gsap.min.js"></script><script src="film.js"></script><script>
const context=document.getElementById('scene').getContext('2d');
const tl=gsap.timeline({paused:true});
tl.to('#scene',{opacity:1,duration:22,ease:'none',onUpdate:()=>FoldedFrequency.render(context,tl.time())});
window.__timelines={'folded-frequency':tl};
FoldedFrequency.render(context,0);
document.fonts.ready.then(()=>FoldedFrequency.render(context,tl.time()));
</script></body></html>
