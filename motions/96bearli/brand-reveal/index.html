<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Reveal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root {
    --ink: #0f172a;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --paper: #f8fafc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: var(--paper); }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(120% 120% at 50% 0%, #eef2ff 0%, #f8fafc 60%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .word {
    position: absolute;
    letter-spacing: -0.04em;
    color: var(--ink);
    line-height: 1;
    will-change: transform, opacity;
    transform-origin: 50% 50%;
  }
  .word--back { font-weight: 900; }
  .word--front { font-weight: 300; }
  .shimmer {
    position: absolute;
    top: -20%; bottom: -20%;
    width: 14%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
    transform: skewX(-20deg);
    filter: blur(1px);
  }
  .mark {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 18px 40px -12px rgba(99,102,241,0.55);
  }
</style>
</head>
<body data-composition-id="compositions/brand-reveal.html"
      data-duration="2.6"
      data-width="1920"
      data-height="1080">
  <div class="stage">
    <div class="clip mark"></div>
    <div class="clip shimmer"></div>
    <h1 class="clip word word--back" style="font-size:220px">NOVA</h1>
    <h2 class="clip word word--front" style="font-size:88px; letter-spacing:0.12em; margin-top:300px; text-transform:uppercase">brand reveal</h2>
  </div>

<script>
  // HyperFrames contract: a paused GSAP timeline published on window.__timelines.
  (function () {
    if (typeof window.gsap === 'undefined') return;

    var tl = gsap.timeline({ paused: true });

    // Accent mark: scale in with a springy ease
    tl.fromTo('.mark', { scale: 0, rotation: -40, opacity: 0 },
                     { scale: 1, rotation: 0, opacity: 1, duration: 0.7, ease: 'back.out(1.7)' }, 0.00);
    // Shimmer sweep across the brand name
    tl.fromTo('.shimmer', { left: '-15%' }, { left: '115%', duration: 1.0, ease: 'power2.inOut' }, 0.20);
    // Wordmark: rise and settle
    tl.fromTo('.word--back', { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: 'power3.out' }, 0.15);
    // Subline: fade up, slight letter-spacing settle
    tl.fromTo('.word--front',
              { y: 40, opacity: 0, letterSpacing: '0.32em' },
              { y: 0, opacity: 1, letterSpacing: '0.12em', duration: 0.8, ease: 'power2.out' }, 0.60);

    // Hold at the end before looping back (total ~2.6s)
    tl.to({}, { duration: 0.6 }, 2.0);

    window.__timelines = window.__timelines || {};
    window.__timelines['compositions/brand-reveal.html'] = tl;
  })();
</script>
</body>
</html>
